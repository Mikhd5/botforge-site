<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tentako Sushi</title><style>body{margin:0;font:16px system-ui;background:#f7f1e8;color:#111;display:grid;place-items:center;min-height:100vh}p{opacity:.7}</style></head><body><p>Завантаження Tentako Sushi…</p><script>const parts=['chunk-01.txt','chunk-02.txt','chunk-03.txt','chunk-04.txt','chunk-05.txt','chunk-06.txt','chunk-07.txt','chunk-08.txt'];(async()=>{try{const xs=await Promise.all(parts.map(x=>fetch(x).then(r=>r.text())));const bin=atob(xs.join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const out=await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer();document.open();document.write(new TextDecoder().decode(out));document.close()}catch(e){document.body.innerHTML='<div style="padding:30px"><h2>Помилка завантаження</h2><p>'+e+'</p></div>'}})()</script></body></html>
