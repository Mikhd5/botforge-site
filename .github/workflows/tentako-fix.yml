name: Finalize Tentako assets

on:
  push:
    paths:
      - '.github/workflows/tentako-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline hero and Sakura background
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('tentako/index.html')
          s = p.read_text(encoding='utf-8')
          hero = base64.b64encode(Path('tentako/assets/hero.webp').read_bytes()).decode()
          bg = base64.b64encode(Path('tentako/assets/site-background.webp').read_bytes()).decode()
          hero_uri = 'data:image/webp;base64,' + hero
          bg_uri = 'data:image/webp;base64,' + bg
          s = s.replace("url('assets/site-background.webp?v=final')", "url('" + bg_uri + "')")
          s = s.replace("src=\"assets/hero.webp?v=final\"", "src=\"" + hero_uri + "\"")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit finalized site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tentako/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Embed Tentako hero and Sakura background'
          git push
