name: Restore Tentako hero and Sakura background

on:
  push:
    paths:
      - '.github/workflows/tentako-restore.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only hero/background presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          html = Path('tentako/index.html')
          s = html.read_text(encoding='utf-8')

          # Restore the exact previous hero image uploaded from the conversation.
          payload = Path('tentako/assets/hero-previous.webp').read_text(encoding='utf-8').strip()
          raw = base64.b64decode(payload)
          Path('tentako/assets/hero-restored.webp').write_bytes(raw)

          # Change hero presentation only. Do not touch menu/product data or JS.
          s = s.replace('src="assets/hero.webp?v=final"', 'src="assets/hero-restored.webp?v=previous"', 1)
          s = s.replace('<div class="sun"></div>', '', 1)
          # Use the Sakura background file directly and keep the existing menu untouched.
          s += '''\n<style id="tentako-hero-restore">.site{background:linear-gradient(rgba(247,242,233,.10),rgba(247,242,233,.10)),url('assets/site-background.webp?v=sakura-final') center top/cover fixed!important}.heroImg{mix-blend-mode:multiply!important}.heroImg img{border-radius:0!important}.art{overflow:visible!important}</style>\n'''
          html.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tentako/index.html tentako/assets/hero-restored.webp
          git commit -m 'Restore previous Tentako hero and Sakura background'
          git push
